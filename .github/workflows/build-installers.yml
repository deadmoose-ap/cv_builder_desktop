name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            artifact: CVBuilder-macOS-AppleSilicon
            file: CVBuilder-macOS-AppleSilicon.dmg
          - runner: macos-15-intel
            artifact: CVBuilder-macOS-Intel
            file: CVBuilder-macOS-Intel.dmg
    runs-on: ${{ matrix.runner }}
    env:
      MACOS_CERTIFICATE_B64: ${{ secrets.MACOS_CERTIFICATE_B64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Import Apple signing certificate
        if: env.MACOS_CERTIFICATE_B64 != ''
        run: |
          echo "$MACOS_CERTIFICATE_B64" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/build.keychain-db"
          security list-keychain -d user -s "$RUNNER_TEMP/build.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
      - run: chmod +x build_macos.sh && DMG_NAME='${{ matrix.file }}' ./build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m pytest -q
      - run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: ./build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CVBuilder-Windows
          path: installer/CVBuilder-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CVBuilder-macOS-AppleSilicon/CVBuilder-macOS-AppleSilicon.dmg
            dist/CVBuilder-macOS-Intel/CVBuilder-macOS-Intel.dmg
            dist/CVBuilder-Windows/CVBuilder-Windows-Setup.exe
          draft: true
          generate_release_notes: true
